<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>review test</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><div class="wrap" style="padding:20px"><div id="root"></div></div>
<script type="module">
// Xem thử trang xem lại bài (không cần đăng nhập), với một lần làm bài giả:
//   tools/reviewtest.html?kind=listening&id=forecast-01&files=http://localhost:8766/
//   files: thư mục chứa bank/listening/<đề>/audio-N.* (mặc định đọc thẳng từ Firebase Storage nếu đã đăng nhập)
import { renderBankReview } from "../js/bank/review.js";
import { findBankItem, gradeItem } from "../js/bank/bank.js";
const p = new URLSearchParams(location.search);
const kind = p.get("kind") || "listening", id = p.get("id") || "forecast-01";
if (p.get("files")) globalThis.BANK_FILE_BASE = p.get("files");
const item = (await findBankItem({ kind, id })).item;
// trả lời đúng câu chẵn, sai câu lẻ
const answers = {};
for (const g of item.groups) {
  if (g.kind === "multi") { answers[`g${g.from}`] = String(item.key[g.from][0]).split(",").map((x, i) => (i ? "Z" : x)); continue; }
  for (let n = g.from; n <= g.to; n++) answers[n] = n % 2 ? "sai" : item.key[n][0];
}
const sub = { ...gradeItem(item, answers), submittedAt: new Date(), durationSec: 1800 };
document.getElementById("root").append(renderBankReview({ go: () => {}, user: { uid: "test" } }, kind, id, sub));
</script></body></html>
